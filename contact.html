<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — ExampleCorp</title>
  <link rel="stylesheet" href="/styles/main.css" />
</head>
<body>
  <header class="site-header"><nav class="container nav"><a class="brand" href="/"><img src="/assets/logo.svg" alt="ExampleCorp" width="32" height="32" /><span>ExampleCorp</span></a></nav></header>
  <main class="container">
    <h1>Contact</h1>
    <p>Tell us about your project. We'll respond within one business day.</p>
    <form id="contact-form" class="contact-form" method="POST" action="https://formspree.io/f/your-endpoint">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>
      <button class="btn btn-primary" type="submit">Send</button>
      <p id="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>
  <footer class="site-footer"><div class="container">© ExampleCorp</div></footer>
  <script src="/scripts/main.js" defer></script>
</body>
</html>
